services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ai_debug_mcp
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_debug_mcp"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      STORAGE_BACKEND: postgresql
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DATABASE: ai_debug_mcp
      PG_USER: postgres
      PG_PASSWORD: postgres
      # 下面两项从宿主机 .env 读取（如未设置则用默认值）
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
      API_KEY: ${API_KEY:-}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
